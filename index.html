<!doctype html>
<html lang="pl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIRST CLASS — Flight Mode On | Partnerships Season 2027</title>
    <meta name="description" content="First Class — warszawski cykl wydarzeń z muzyką house. Sezon 2027: sześć edycji, sześć destynacji, jedna marka. Partnerstwa dla marek premium." />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Space Mono (small technical labels, as in the deck) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                orange: "#ff7300",
                amber: "#ff8800",
                gold: "#e5a14c",
                subtitle: "#ff7300",
                dark: "#08080a",
                card: "#111116",
                border: "#23232c",
              },
            },
            fontFamily: {
              sans: ['"Open Sauce One"', "sans-serif"],
              glacial: ['"Glacial Indifference"', "sans-serif"],
              cy: ['"Cy Grotesk V3 Wide"', "sans-serif"],
              mono: ['"Space Mono"', "monospace"],
            },
            boxShadow: {
              "neon-orange": "0 0 35px -5px rgba(255, 115, 0, 0.45)",
              "neon-sm": "0 0 15px -3px rgba(255, 115, 0, 0.3)",
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="css/style.css">
</head>

  <body
    class="bg-brand-dark text-zinc-200 font-sans selection:bg-brand-orange selection:text-black antialiased relative overflow-x-hidden"
  >
    <!-- First Class plane symbol (traced from the deck), reused by sections via <use href="#fc-plane"> -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <symbol id="fc-plane" viewBox="-12 -12 706 674">
        <path pathLength="1" d="M460 0 L320 24 L131 347 L0 378 L5 426 L11 431 L138 412 L356 650 L553 623 L560 615 L552 567 L542 562 L386 582 L231 404 L333 385 L571 355 L682 250 L633 205 L527 297 L220 341 L368 82 L471 57 Z" />
      </symbol>
    </svg>

    <!-- ============================================================ -->
        <div id="1-airlock"></div>

    <!-- ======================================================== -->
        <div id="2-header"></div>
<!-- MAIN: sections follow the order of the presentation (slides 1–19) -->
    <!-- ======================================================== -->
    <main class="fc-main relative w-full bg-brand-dark">
    <div id="3-hero"></div>
    <div id="4-journey"></div>
    <div id="4-space"></div>
    <div id="6-mike"></div>
    <div id="7-values"></div>
    <div id="7-inside"></div>
    <div id="7-numbers"></div>
    <div id="8-editorial"></div>
    <div id="9-brand"></div>
    <div id="10-marketing"></div>
    <div id="10-packages"></div>
    <div id="5-destinations"></div>
    <div id="14-season"></div>
    <div id="12-process"></div>
    <div id="16-gallery-intro"></div>
    <div id="8-gallery"></div>
    <div id="13-boarding"></div>
</main>

    <!-- ======================================================== -->
    <!-- FOOTER (clouds + contact, Z-INDEX 30)                    -->
    <!-- ======================================================== -->
        <div id="11-footer"></div>

    <!-- ✈ Orange flight cursor — leads the tube animation -->
    <div id="flight-cursor" style="
      position: fixed;
      left: 0; top: 0;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) rotate(-45deg);
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.08s ease;
      will-change: left, top;
    ">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none"
           stroke="#ff7300" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round"
           style="filter: drop-shadow(0 0 6px rgba(255,115,0,0.9)) drop-shadow(0 0 14px rgba(255,115,0,0.5));">
        <path d="M17.8 19.2L16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.3c.4-.2.6-.6.5-1.1z"/>
      </svg>
    </div>

    <style>
      /* Hide default cursor on sections where tubes canvas is active */
      .section-tubes-canvas ~ * { cursor: none; }
      .cursor-crosshair          { cursor: none !important; }
      /* Mouse users see only the orange plane — no system arrow (the lightbox keeps a normal cursor) */
      @media (hover: hover) and (pointer: fine) {
        html.fc-js, html.fc-js * { cursor: none !important; }
        html.fc-js .fc-lightbox, html.fc-js .fc-lightbox * { cursor: auto !important; }
      }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
