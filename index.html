<!doctype html>
<html lang="pl" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FIRST CLASS — Flight Mode On | Partnerships Season 2027</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Montserrat, Playfair Display, Space Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                orange: "#ff6200",
                amber: "#ff8800",
                gold: "#e5a14c",
                subtitle: "#ff7300",
                dark: "#08080a",
                card: "#111116",
                border: "#23232c",
              },
            },
            fontFamily: {
              sans: ['"Open Sauce One"', "sans-serif"],
              glacial: ['"Glacial Indifference"', "sans-serif"],
              cy: ['"Cy Grotesk V3 Wide"', "sans-serif"],
              horizon: ['"Horizon"', '"Cy Grotesk V3 Wide"', "sans-serif"],
              montserrat: ['"Montserrat"', "sans-serif"],
              serif: ['"Playfair Display"', "serif"],
              mono: ['"Space Mono"', "monospace"],
            },
            boxShadow: {
              "neon-orange": "0 0 35px -5px rgba(255, 98, 0, 0.45)",
              "neon-sm": "0 0 15px -3px rgba(255, 98, 0, 0.3)",
            },
          },
        },
      };
    </script>

    
    <link rel="stylesheet" href="css/style.css">
</head>

  <body
    class="bg-brand-dark text-zinc-200 font-sans selection:bg-brand-orange selection:text-black antialiased relative overflow-x-hidden"
  >

    <!-- ============================================================ -->
        <div id="1-airlock"></div>

    <!-- ======================================================== -->
        <div id="2-header"></div>
<!-- MAIN: СЕКЦИИ С ИНДИВИДУАЛЬНЫМИ ХОЛСТАМИ                  -->
    <!-- ======================================================== -->
    <main class="relative w-full bg-brand-dark overflow-hidden">
          <div id="3-hero"></div>
    <div id="4-journey"></div>
    <div id="5-destinations"></div>
    <div id="6-mike"></div>
    <div id="7-numbers"></div>
    <div id="8-gallery"></div>
    <div id="9-brand"></div>
    <div id="10-packages"></div>
</main>

    <!-- ======================================================== -->
    <!-- 12. FOOTER (БЕЗ КАНВАСА, Z-INDEX 30)                     -->
    <!-- ======================================================== -->
        <div id="11-footer"></div>


    <!-- ======================================================== -->
    <!-- 13. JS SCRIPTS & THREEJS TUBES INITIALIZATION            -->
    <!-- ======================================================== -->
    <script>
      // 1. Mobile Menu Toggle
      const mobileBtn = document.getElementById("mobile-menu-btn");
      const mobileMenu = document.getElementById("mobile-menu");
      const mobileLinks = document.querySelectorAll(".mobile-link");

      mobileBtn.addEventListener("click", () => {
        mobileMenu.classList.toggle("hidden");
      });

      mobileLinks.forEach((link) => {
        link.addEventListener("click", () => {
          mobileMenu.classList.add("hidden");
        });
      });

      // 2. Select package from cards to pre-fill select element
      function selectPackage(tierName) {
        const select = document.getElementById("form-tier");
        if (select) {
          select.value = tierName;
        }
        const target = document.getElementById("boarding-pass");
        if (target) {
          target.scrollIntoView({ behavior: "smooth" });
        }
      }

      // 3. Form Submit -> Boarding Pass Generation
      const partnerForm = document.getElementById("partner-form");
      const ticketResult = document.getElementById("ticket-result");

      partnerForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const nameVal = document.getElementById("form-name").value || "Gość";
        const brandVal =
          document.getElementById("form-brand").value || "Partner";
        const tierVal =
          document.getElementById("form-tier").value || "Business";

        document.getElementById("ticket-name").textContent =
          nameVal.toUpperCase();
        document.getElementById("ticket-brand").textContent =
          brandVal.toUpperCase();
        document.getElementById("ticket-tier").textContent = tierVal;

        ticketResult.classList.remove("hidden");
        ticketResult.scrollIntoView({ behavior: "smooth", block: "nearest" });
      });
    </script>

    <!-- ============================================================ -->
    <!-- AIRLOCK HERO — vanilla JS initialisation                      -->
    <!-- ============================================================ -->
    

    <!-- ✈ Orange flight cursor — leads the tube animation -->
    <div id="flight-cursor" style="
      position: fixed;
      left: 0; top: 0;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%) rotate(0deg);
      opacity: 0;
      transition: opacity 0.25s ease, transform 0.08s ease;
      will-change: left, top;
    ">
      <img
        src="images/First Class Season 2027.svg"
        alt="Flight Cursor"
        class="w-8 h-8 object-contain"
        style="filter: drop-shadow(0 0 6px rgba(255,98,0,0.9)) drop-shadow(0 0 14px rgba(255,98,0,0.5));"
      />
    </div>

    <style>
      /* Hide default cursor on sections where tubes canvas is active */
      .section-tubes-canvas ~ * { cursor: none; }
      .cursor-crosshair          { cursor: none !important; }
    </style>

    

    <!-- ES Module: Инициализация WebGL TubesCursor для каждого канваса секции -->
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
