<!-- AIRLOCK SPACESHIP HERO — scroll-locked scrub-driven intro     -->
    <!-- ============================================================ -->
    <div id="airlock-hero" style="position:relative;z-index:100;height:100dvh;width:100%;overflow:hidden;background:#05070d;">

      <video id="airlock-video"
        src="iss-hero-1080p.mp4"
        poster="iss-hero-poster.jpg"
        muted playsinline preload="auto" aria-hidden="true"
        style="position:absolute;inset:0;height:100%;width:100%;object-fit:cover;opacity:0;transform-origin:center center;will-change:transform;transition:opacity 0.6s ease;">
      </video>

      <div style="pointer-events:none;position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,13,.38),rgba(5,7,13,0) 30%,rgba(5,7,13,.15) 70%,rgba(5,7,13,.58));"></div>
      <div id="airlock-scrim" style="pointer-events:none;position:absolute;inset:0;background:radial-gradient(ellipse 62% 44% at 50% 50%,rgba(5,7,13,.68),rgba(5,7,13,0) 72%);"></div>

      <div id="airlock-title" style="pointer-events:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 6%;text-align:center;">
        <h1 style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:clamp(30px,7vw,96px);font-weight:800;line-height:1;letter-spacing:-.02em;color:#f2f4f8;text-shadow:0 4px 30px rgba(0,0,0,.55);will-change:transform,filter,opacity;margin:0;">FIRST CLASS</h1>
      </div>

      <div id="airlock-tagline" style="pointer-events:none;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:0 8%;text-align:center;opacity:0;">
        <p style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:clamp(20px,3.4vw,40px);font-weight:700;line-height:1.2;letter-spacing:-.01em;color:#f2f4f8;text-shadow:0 4px 24px rgba(0,0,0,.6);margin:0;">Flight Mode On</p>
      </div>

      <div id="airlock-hint" style="pointer-events:none;position:absolute;bottom:clamp(20px,6vh,48px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;color:rgba(240,244,248,.72);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:clamp(10px,1.4vw,12px);font-weight:600;letter-spacing:.3em;transition:opacity .4s;">
        <span>SCROLL</span>
        <svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true" style="animation:airlock-bounce 1.6s ease-in-out infinite;">
          <style>@keyframes airlock-bounce{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(5px);opacity:1}}@media(prefers-reduced-motion:reduce){#airlock-hint svg{animation:none!important}}</style>
          <path d="M7 1 L7 17 M2 12 L7 17 L12 12" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <button id="airlock-skip" type="button"
        style="position:absolute;left:50%;top:16px;z-index:10;transform:translateX(-50%);border-radius:9999px;padding:8px 16px;font-size:12px;font-weight:600;opacity:0;transition:opacity .2s;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#f2f4f8;background:rgba(5,7,13,.7);letter-spacing:.08em;border:none;cursor:pointer;"
        onfocus="this.style.opacity='1'" onblur="this.style.opacity='0'">
        Skip intro
      </button>

      <div style="position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.12);">
        <div id="airlock-bar" style="height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,rgba(255,115,0,.45),rgba(255,176,80,.95));"></div>
      </div>
    </div>
    <!-- /AIRLOCK HERO -->
