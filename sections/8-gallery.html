<!-- 7. GALERIA ZDJĘĆ (presentation slide 18) — bento mosaic + lightbox -->
<section id="atmosphere" class="fc-gallery relative overflow-hidden">
  <div class="relative z-10 mx-auto max-w-7xl px-5 py-24 sm:px-8 lg:py-32">
    <div class="fc-bento" data-gallery>
      <button type="button" class="fc-bento__item fc-bento__item--a" data-tilt><img src="images/image_13.jpg" alt="DJ w czapce gra dla tłumu pod sceną" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--b" data-tilt><img src="images/cabin_crew.jpg" alt="Cabin crew First Class salutuje na scenie" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--c" data-tilt><img src="images/dj_energy.jpg" alt="Artysta przy konsolecie w pomarańczowym świetle" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <div class="fc-bento__title">
        <h2 class="fc-title"><span>Galeria</span> <em data-neon>zdjęć</em></h2>
        <p>Doświadczenie marki w realnym świecie: dźwięk, przestrzeń i autentyczna społeczność.</p>
      </div>
      <button type="button" class="fc-bento__item fc-bento__item--d" data-tilt><img src="images/image_15.jpg" alt="Scena i tłum w ciepłym świetle reflektorów" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--e" data-tilt><img src="images/image_22.jpg" alt="Artystka za konsoletą przy świetlnym ekranie" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--f" data-tilt><img src="images/guests_dancing.jpg" alt="Goście tańczący pod sceną" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--g" data-tilt><img src="images/dj_offwhite.jpg" alt="DJ i goście w czerwonym świetle" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--h" data-tilt><img src="images/logo_projection.jpg" alt="Projekcja logo First Class na ścianie" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>
      <button type="button" class="fc-bento__item fc-bento__item--i" data-tilt><img src="images/crowd_golden.jpg" alt="Tłum gości w złotej mgle" loading="lazy"><span class="fc-glare" aria-hidden="true"></span></button>

  </div>

  <dialog class="fc-lightbox" aria-label="Podgląd zdjęcia">
    <figure><img alt=""><figcaption></figcaption></figure>
    <button type="button" class="fc-lightbox__close" aria-label="Zamknij">✕</button>
    <button type="button" class="fc-lightbox__nav fc-lightbox__nav--prev" aria-label="Poprzednie zdjęcie">←</button>
    <button type="button" class="fc-lightbox__nav fc-lightbox__nav--next" aria-label="Następne zdjęcie">→</button>
  </dialog>
</section>
